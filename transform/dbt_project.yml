name: jds
version: "1.0.0"
profile: jds

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false # konsisten dengan dlt: tanpa telemetri

vars:
  fx_pair: "USD/IDR"
  fx_change_threshold_pct: 1.0 # anomali kurs: |perubahan| > 1% vs hari kurs sebelumnya
  pm25_threshold: 55 # anomali udara: rata-rata harian PM2.5 > 55 µg/m³ (hari lengkap)

models:
  jds:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
