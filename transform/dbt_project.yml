name: jds
version: "1.0.0"
profile: jds

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  fx_pair: "USD/IDR"
  fx_change_threshold_pct: 1.0 # |change| vs the previous published rate
  pm25_threshold: 55 # daily mean PM2.5 in µg/m³, complete days only

models:
  jds:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
