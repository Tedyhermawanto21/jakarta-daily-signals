version: 2

models:
  - name: fct_daily_signals
    description: >
      Daily Jakarta signals, one row per (date_wib, location_id): as-of USD/IDR rate,
      weather and daily PM2.5.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_wib, location_id]
    columns:
      - name: date_wib
        data_tests: [not_null]
      - name: location_id
        data_tests: [not_null]
      - name: fx_is_carried_forward
        description: True when no rate was published on this date and the previous business day's rate is used.
        data_tests: [not_null]
      - name: aq_is_complete
        description: True when all 24 actual hours exist. Only complete days are judged for anomalies.
        data_tests: [not_null]
      - name: pm25_category_ispu
        data_tests:
          - accepted_values:
              arguments:
                values: ["Baik", "Sedang", "Tidak Sehat", "Sangat Tidak Sehat", "Berbahaya"]

  - name: fct_anomalies
    description: One row per anomaly. Read by the Telegram summary, deduplicated via ops.alert_log.
    data_tests:
      - unique_combination:
          arguments:
            columns: [signal_date, alert_type, location_id]
    columns:
      - name: signal_date
        data_tests: [not_null]
      - name: alert_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["fx_move", "pm25_high"]
      - name: detail
        data_tests: [not_null]

  - name: dash_daily_signals
    description: >
      Dashboard source: one row per actual day and location, with 0/1 anomaly flags from
      fct_anomalies. Read by Looker Studio as looker_reader.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_wib, location_id]
    columns:
      - name: fx_pct_change_day
        description: FX % change on publication days only; null on weekends and ECB holidays.
      - name: fx_anomaly_flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: pm25_anomaly_flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: dash_air_quality_hourly
    description: Dashboard source for hourly PM2.5 in WIB, actual hours only.
    data_tests:
      - unique_combination:
          arguments:
            columns: [ts_wib, location_id]
    columns:
      - name: hour_wib
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 0, max_value: 23 }

  - name: dash_latest_summary
    description: >
      Dashboard scorecards: one row per location for the last actual day, its anomaly status,
      and the next day's forecast.
    columns:
      - name: location_id
        data_tests: [unique, not_null]
      - name: summary_date
        data_tests: [not_null]
      - name: status_text
        data_tests: [not_null]

unit_tests:
  # 90 days of real data never moved FX by more than 1%, so the rule is proven on fixtures.
  - name: anomaly_rules_thresholds_and_complete_days
    description: >
      FX: |change| must be greater than 1% (exactly 1.00 is not). PM2.5: the daily mean must be
      greater than 55, on complete days only.
    model: fct_anomalies
    given:
      - input: ref('int_fx_daily_change')
        rows:
          - { rate_date: 2026-11-16, pair: USD/IDR, rate: 18000, prev_rate_date: 2026-11-13, prev_rate: 18000, pct_change: 0.00 }
          - { rate_date: 2026-11-17, pair: USD/IDR, rate: 18180, prev_rate_date: 2026-11-16, prev_rate: 18000, pct_change: 1.00 }
          - { rate_date: 2026-11-18, pair: USD/IDR, rate: 18400, prev_rate_date: 2026-11-17, prev_rate: 18180, pct_change: 1.21 }
          - { rate_date: 2026-11-19, pair: USD/IDR, rate: 18100, prev_rate_date: 2026-11-18, prev_rate: 18400, pct_change: -1.63 }
      - input: ref('fct_daily_signals')
        rows:
          - { date_wib: 2026-11-16, location_id: jkt_monas, aq_is_complete: true, pm25_avg: 55.0, pm25_max: 80, pm25_peak_hour: 6, pm25_category_ispu: Sedang }
          - { date_wib: 2026-11-17, location_id: jkt_monas, aq_is_complete: true, pm25_avg: 60.2, pm25_max: 99, pm25_peak_hour: 22, pm25_category_ispu: Tidak Sehat }
          - { date_wib: 2026-11-18, location_id: jkt_monas, aq_is_complete: false, pm25_avg: 90.0, pm25_max: 120, pm25_peak_hour: 5 }
    expect:
      rows:
        - { signal_date: 2026-11-18, location_id: all, alert_type: fx_move, detail: "USD/IDR 18.400 (+1,21% vs 17 Nov)" }
        - { signal_date: 2026-11-19, location_id: all, alert_type: fx_move, detail: "USD/IDR 18.100 (-1,63% vs 18 Nov)" }
        - { signal_date: 2026-11-17, location_id: jkt_monas, alert_type: pm25_high, detail: "PM2.5 rata-rata 60,2 µg/m³ (Tidak Sehat), puncak 99,0 µg/m³ jam 22:00 WIB" }

  - name: dash_flags_count_weekend_fx_once
    description: >
      Weekend rates are carried forward from Friday, so the % change and FX flag appear only on
      the publication day. Forecast days are excluded.
    model: dash_daily_signals
    given:
      - input: ref('fct_daily_signals')
        rows:
          - { date_wib: 2026-11-13, location_id: jkt_monas, weather_is_forecast: false, fx_rate_date: 2026-11-13, fx_is_carried_forward: false, fx_pct_change: 1.50 }
          - { date_wib: 2026-11-14, location_id: jkt_monas, weather_is_forecast: false, fx_rate_date: 2026-11-13, fx_is_carried_forward: true, fx_pct_change: 1.50 }
          - { date_wib: 2026-11-15, location_id: jkt_monas, weather_is_forecast: true, fx_rate_date: 2026-11-13, fx_is_carried_forward: true, fx_pct_change: 1.50 }
      - input: ref('fct_anomalies')
        rows:
          - { signal_date: 2026-11-13, location_id: all, alert_type: fx_move }
          - { signal_date: 2026-11-14, location_id: jkt_monas, alert_type: pm25_high }
    expect:
      rows:
        - { date_wib: 2026-11-13, fx_pct_change_day: 1.50, fx_anomaly_flag: 1, pm25_anomaly_flag: 0 }
        - { date_wib: 2026-11-14, fx_pct_change_day: null, fx_anomaly_flag: 0, pm25_anomaly_flag: 1 }
