version: 2

models:
  - name: int_fx_daily_change
    description: Rate and % change vs the previous published rate, one row per (rate_date, pair).
    data_tests:
      - unique_combination:
          arguments:
            columns: [rate_date, pair]
    columns:
      - name: pct_change
        description: Null for the first row, which has nothing to compare with.

  - name: int_air_quality_daily
    description: Daily PM2.5 mean and peak from actual hours.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_wib, location_id]
    columns:
      - name: hours_actual
        data_tests:
          - accepted_range:
              arguments: { min_value: 1, max_value: 24 }
      - name: pm25_peak_hour
        data_tests:
          - accepted_range:
              arguments: { min_value: 0, max_value: 23 }
