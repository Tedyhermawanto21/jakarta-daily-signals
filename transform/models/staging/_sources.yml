version: 2

sources:
  - name: raw
    description: Data mentah hasil dlt (write_disposition=merge). Jangan diedit manual.
    schema: raw
    config:
      # _dlt_load_id = epoch detik saat load. Merge menulis ulang baris, jadi max = load terakhir.
      loaded_at_field: "to_timestamp(_dlt_load_id::numeric)"
      freshness:
        warn_after: { count: 2, period: day }
        error_after: { count: 3, period: day }
    tables:
      - name: fx_rates
        description: Kurs referensi ECB via Frankfurter. Hanya hari kerja ECB.
        config:
          freshness: # akhir pekan panjang + libur ECB
            warn_after: { count: 4, period: day }
            error_after: { count: 6, period: day }
      - name: weather_daily
        description: Cuaca harian Open-Meteo (Historical Forecast API), tanggal WIB.
      - name: air_quality_hourly
        description: Kualitas udara per jam Open-Meteo (model CAMS), waktu WIB.
