version: 2

sources:
  - name: raw
    description: Raw tables loaded by dlt (write_disposition=merge). Do not edit by hand.
    schema: raw
    config:
      # _dlt_load_id is the load time in epoch seconds; merge rewrites rows on every load.
      loaded_at_field: "to_timestamp(_dlt_load_id::numeric)"
      freshness:
        warn_after: { count: 2, period: day }
        error_after: { count: 3, period: day }
    tables:
      - name: fx_rates
        description: ECB reference rates via Frankfurter. ECB business days only.
        config:
          freshness: # long weekends and ECB holidays
            warn_after: { count: 4, period: day }
            error_after: { count: 6, period: day }
      - name: weather_daily
        description: Daily weather from Open-Meteo (Historical Forecast API), WIB dates.
      - name: air_quality_hourly
        description: Hourly air quality from Open-Meteo (CAMS model), WIB times.
