version: 2

models:
  - name: stg_fx_rates
    description: Kurs harian, 1 baris per (rate_date, pair).
    data_tests:
      - unique_combination:
          arguments:
            columns: [rate_date, base, quote]
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: pair
        data_tests: [not_null]
      - name: rate
        description: Jumlah quote per 1 base (mis. IDR per 1 USD).
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 10000, max_value: 30000 } # sanity check USD/IDR

  - name: stg_weather_daily
    description: Cuaca harian per lokasi, tanggal WIB.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_wib, location_id]
    columns:
      - name: date_wib
        data_tests: [not_null]
      - name: location_id
        data_tests: [not_null]
      - name: temp_max_c
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 15, max_value: 45 }
      - name: temp_min_c
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 15, max_value: 45 }
      - name: precipitation_mm
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 0, max_value: 500 }
      - name: humidity_mean_pct
        data_tests:
          - accepted_range:
              arguments: { min_value: 0, max_value: 100 }

  - name: stg_air_quality_hourly
    description: Kualitas udara per jam per lokasi, waktu WIB.
    data_tests:
      - unique_combination:
          arguments:
            columns: [ts_wib, location_id]
    columns:
      - name: ts_wib
        data_tests: [not_null]
      - name: date_wib
        data_tests: [not_null]
      - name: hour_wib
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 0, max_value: 23 }
      - name: pm25
        description: PM2.5 µg/m³. Boleh null di jam prakiraan; jam aktual dites di singular test.
        data_tests:
          - accepted_range:
              arguments: { min_value: 0, max_value: 1000 }
