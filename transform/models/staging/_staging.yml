version: 2

models:
  - name: stg_fx_rates
    description: Daily FX rates, one row per (rate_date, pair).
    data_tests:
      - unique_combination:
          arguments:
            columns: [rate_date, base, quote]
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: pair
        data_tests: [not_null]
      - name: rate
        description: Quote units per 1 base unit (e.g. IDR per USD).
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 10000, max_value: 30000 } # sanity check USD/IDR

  - name: stg_weather_daily
    description: Daily weather per location, WIB dates.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_wib, location_id]
    columns:
      - name: date_wib
        data_tests: [not_null]
      - name: location_id
        data_tests: [not_null]
      - name: temp_max_c
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 15, max_value: 45 }
      - name: temp_min_c
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 15, max_value: 45 }
      - name: precipitation_mm
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 0, max_value: 500 }
      - name: humidity_mean_pct
        data_tests:
          - accepted_range:
              arguments: { min_value: 0, max_value: 100 }

  - name: stg_air_quality_hourly
    description: Hourly air quality per location, WIB times.
    data_tests:
      - unique_combination:
          arguments:
            columns: [ts_wib, location_id]
    columns:
      - name: ts_wib
        data_tests: [not_null]
      - name: date_wib
        data_tests: [not_null]
      - name: hour_wib
        data_tests:
          - not_null
          - accepted_range:
              arguments: { min_value: 0, max_value: 23 }
      - name: pm25
        description: PM2.5 in µg/m³. May be null for forecast hours; actual hours are tested separately.
        data_tests:
          - accepted_range:
              arguments: { min_value: 0, max_value: 1000 }
