name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  # Cancelling would let the old run's cleanup drop the new run's schemas.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + pytest + dbt parse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Required by profiles.yml; `dbt parse` never connects.
      DBT_PG_HOST: localhost
      DBT_PG_USER: ci
      DBT_PG_PASSWORD: unused
      DBT_PG_DBNAME: jds
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: SQLFluff lint
        run: uv run sqlfluff lint transform

      - name: Pytest
        run: uv run pytest

      - name: dbt parse
        run: uv run dbt parse --project-dir transform --profiles-dir transform

  dbt-build:
    name: dbt build (Neon dev, schema ci_pr_<n>)
    needs: lint-test
    # Fork PRs get no secrets, so this job is skipped for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DBT_SCHEMA_PREFIX: ci_pr_${{ github.event.pull_request.number }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked --no-dev

      - name: dbt build into ci_pr_<n>_staging and ci_pr_<n>_marts
        run: uv run python -m jds.run_dbt build

      - name: Drop CI schemas
        if: always()
        run: uv run python -m jds.ci_schemas drop
