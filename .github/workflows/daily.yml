name: daily

on:
  schedule:
    - cron: "17 0 * * *" # 07:17 WIB, off the top of the hour to avoid queueing
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (optional, for backfills)"
        required: false
        default: ""
      end:
        description: "End date YYYY-MM-DD (optional, defaults to today in WIB)"
        required: false
        default: ""
      send_alert:
        description: "Send the Telegram summary"
        type: boolean
        default: true

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DB_HOST: ${{ vars.EXPECTED_DB_HOST }}
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
    steps:
      - name: Require the production host guard
        run: |
          if [ -z "$EXPECTED_DB_HOST" ]; then
            echo "::error::Repository variable EXPECTED_DB_HOST is not set (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked --no-dev

      - name: Create schemas
        run: uv run python -m jds.check_db --init

      - name: Ingest to Neon (dlt, merge)
        env:
          # Inputs go through env, never ${{ }} inside the script, to prevent injection.
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          args=(--source all --dest postgres)
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          if [ -n "$END" ]; then args+=(--end "$END"); fi
          uv run python -m jds.pipeline "${args[@]}"

      - name: Transform and test (dbt build)
        run: uv run python -m jds.run_dbt build

      - name: Source freshness
        run: uv run python -m jds.run_dbt source freshness

      - name: Telegram summary (once per day)
        if: github.event_name == 'schedule' || inputs.send_alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m jds.alerts.run_alerts
